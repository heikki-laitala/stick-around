# Dependency update automation.
#
# Added after a two-month drift went unnoticed: tauri was 5 patch
# releases behind and the vitest dev chain had accumulated a critical
# advisory. Nothing here can merge on its own — main's ruleset still
# requires CI plus a Code Owners review — so these are review prompts,
# not auto-merges.
#
# Note: version updates (this file) are independent of Dependabot
# security alerts, which are a repository setting and must be enabled in
# the GitHub UI under Settings -> Advanced Security.
version: 2

updates:
  # GitHub Actions. This is the ecosystem that matters most here,
  # because every `uses:` in this repo is pinned to an immutable commit
  # SHA. Pins are a supply-chain win but they never expire on their own,
  # so without Dependabot they silently rot. Dependabot rewrites both
  # the SHA and the trailing `# vX.Y.Z` comment, which is exactly the
  # convention the workflows already use.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # npm. All four direct deps are dev/build tooling except
  # @tauri-apps/api; tauri.conf.json ships src/ unbundled, so nothing
  # here reaches users at runtime. Minor and patch bumps are grouped
  # into one PR; majors get their own so they can be reviewed and
  # tested on their own merits (vitest 3 -> 4 was a real major).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Cargo. The manifest is at src-tauri/Cargo.toml, not the repo root.
  # Grouped the same way: the lockfile refresh that moves 130+
  # transitive crates is one reviewable PR, while a major bump (e.g.
  # the `windows` crate, still on 0.58) arrives separately.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # Two crates are held back at their current major on purpose. Both
    # are the whole of a platform integration, and both sit in the code
    # paths CI cannot actually exercise: `windows` backs the UI
    # Automation TextPattern reader in platform/windows.rs, and `zbus`
    # backs AT-SPI text reading plus the GNOME Shell helper D-Bus
    # interface in platform/linux*.rs. A green build-windows or
    # build-linux proves those still compile, and the smoke test proves
    # the binary starts, but nothing asserts terminal text is still
    # being read — so a major that compiles can ship broken. See the
    # reasoning on the closed PRs #40 (windows 0.58 -> 0.61) and #41
    # (zbus 4 -> 5); take these deliberately, alongside platform work,
    # with a real machine to test on. Minor and patch updates for both
    # crates still come through normally.
    ignore:
      - dependency-name: "windows"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zbus"
        update-types: ["version-update:semver-major"]
